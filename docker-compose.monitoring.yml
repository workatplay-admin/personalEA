version: '3.8'

# PersonalEA Comprehensive Monitoring Stack
# This stack provides complete observability for the PersonalEA platform

services:
  # Prometheus - Metrics Collection and Storage
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: personalea-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./deployment/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - monitoring
      - backend
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9090"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Grafana - Visualization and Dashboards
  grafana:
    image: grafana/grafana:10.2.3
    container_name: personalea-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel,redis-datasource,postgres-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/personalea-overview.json
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_LEVEL=info
    volumes:
      - ./deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # AlertManager - Alert Routing and Management
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: personalea-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}'
    volumes:
      - ./deployment/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: personalea-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deployment/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Promtail - Log Shipper
  promtail:
    image: grafana/promtail:2.9.3
    container_name: personalea-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deployment/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: personalea-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: personalea-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  # Postgres Exporter - PostgreSQL Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: personalea-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://personalea:${POSTGRES_PASSWORD}@postgres:5432/personalea?sslmode=disable"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped
    networks:
      - monitoring
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  # Redis Exporter - Redis Metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: personalea-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:9121:9121"
    restart: unless-stopped
    networks:
      - monitoring
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  # Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: personalea-nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    ports:
      - "127.0.0.1:9113:9113"
    restart: unless-stopped
    networks:
      - monitoring
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # Blackbox Exporter - Endpoint Monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: personalea-blackbox-exporter
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./deployment/monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    restart: unless-stopped
    networks:
      - monitoring
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  # Prometheus Pushgateway - For Batch Jobs
  pushgateway:
    image: prom/pushgateway:v1.6.2
    container_name: personalea-pushgateway
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: personalea-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:5775:5775/udp"  # Agent accept zipkin.thrift
      - "127.0.0.1:6831:6831/udp"  # Agent accept jaeger.thrift
      - "127.0.0.1:6832:6832/udp"  # Agent accept jaeger.thrift binary
      - "127.0.0.1:5778:5778"      # Agent serve configs
      - "127.0.0.1:16686:16686"    # Jaeger UI
      - "127.0.0.1:14268:14268"    # Accept jaeger.thrift
      - "127.0.0.1:14250:14250"    # Accept gRPC
      - "127.0.0.1:9411:9411"      # Zipkin compatible endpoint
      - "127.0.0.1:4317:4317"      # OTLP gRPC
      - "127.0.0.1:4318:4318"      # OTLP HTTP
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # Tempo - Trace Storage (Alternative to Jaeger)
  tempo:
    image: grafana/tempo:2.3.1
    container_name: personalea-tempo
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./deployment/monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"   # tempo
      - "127.0.0.1:9095:9095"   # tempo grpc
      - "127.0.0.1:4317:4317"   # otlp grpc
      - "127.0.0.1:4318:4318"   # otlp http
      - "127.0.0.1:9411:9411"   # zipkin
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  nginx_logs:
    external: true

networks:
  monitoring:
    external: true
    name: personalea_monitoring
  backend:
    external: true
    name: personalea_backend
  frontend:
    external: true
    name: personalea_frontend