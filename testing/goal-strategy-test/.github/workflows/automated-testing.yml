name: Automated User Testing

on:
  push:
    branches: [ main, develop, Claude-Flow ]
    paths:
      - 'testing/goal-strategy-test/**'
      - 'services/goal-strategy/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'testing/goal-strategy-test/**'
      - 'services/goal-strategy/**'
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      use_real_api:
        description: 'Use real OpenAI API'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      browser:
        description: 'Browser to test'
        required: false
        default: 'chromium'
        type: choice
        options:
        - 'chromium'
        - 'firefox'
        - 'webkit'
        - 'all'

env:
  NODE_VERSION: '18'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  USE_REAL_API: ${{ github.event.inputs.use_real_api || 'false' }}
  BROWSER: ${{ github.event.inputs.browser || 'chromium' }}

jobs:
  automated-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(
          github.event.inputs.browser == 'all' && 
          '["chromium", "firefox", "webkit"]' || 
          format('["{0}"]', github.event.inputs.browser || 'chromium')
        ) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'testing/goal-strategy-test/package-lock.json'
    
    - name: Install dependencies
      working-directory: testing/goal-strategy-test
      run: |
        npm ci
        npx playwright install --with-deps ${{ matrix.browser }}
    
    - name: Install backend dependencies
      working-directory: services/goal-strategy
      run: npm ci
    
    - name: Start backend service
      working-directory: services/goal-strategy
      run: |
        npm run build
        npm start &
        echo "Backend started"
        # Wait for backend to be ready
        for i in {1..30}; do
          if curl -f http://localhost:8085/health > /dev/null 2>&1; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 2
        done
    
    - name: Start mock API (if not using real API)
      if: env.USE_REAL_API != 'true'
      working-directory: testing/goal-strategy-test
      run: |
        node openai-api-server.js &
        echo "Mock API started"
        # Wait for mock API to be ready
        for i in {1..15}; do
          if curl -f http://localhost:3001/health > /dev/null 2>&1; then
            echo "Mock API is ready"
            break
          fi
          echo "Waiting for mock API... ($i/15)"
          sleep 1
        done
    
    - name: Start frontend
      working-directory: testing/goal-strategy-test
      run: |
        npm run dev &
        echo "Frontend started"
        # Wait for frontend to be ready
        for i in {1..30}; do
          if curl -f http://localhost:5173 > /dev/null 2>&1; then
            echo "Frontend is ready"
            break
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 2
        done
    
    - name: Run automated user tests
      working-directory: testing/goal-strategy-test
      run: |
        export CI=true
        export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
        export USE_REAL_API="${{ env.USE_REAL_API }}"
        ./run-automated-tests.sh --browser=${{ matrix.browser }} --ci
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.browser }}
        path: testing/goal-strategy-test/test-results/
        retention-days: 30
    
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.browser }}
        path: testing/goal-strategy-test/playwright-report/
        retention-days: 30
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'testing/goal-strategy-test/test-results/automated-test-summary.md';
          
          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Automated User Testing Results (${{ matrix.browser }})\n\n${report}`
            });
          }

  notify-success:
    needs: automated-testing
    runs-on: ubuntu-latest
    if: success()
    steps:
    - name: Notify success
      run: |
        echo "🎉 All automated user tests passed!"
        echo "✅ App is ready for human validation"

  notify-failure:
    needs: automated-testing
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: Notify failure
      run: |
        echo "❌ Automated user tests failed"
        echo "🔧 Fix issues before proceeding to human testing"
        exit 1