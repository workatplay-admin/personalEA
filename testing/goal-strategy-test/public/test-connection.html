<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Backend Connection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    
    <button onclick="testHealth()">Test Health Endpoint</button>
    <button onclick="testAuthToken()">Test Auth Token Endpoint</button>
    <button onclick="testBoth()">Test Both Endpoints</button>
    
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');

        function addResult(title, success, data) {
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${success ? 'success' : 'error'}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            resultsDiv.appendChild(resultDiv);
        }

        async function testHealth() {
            resultsDiv.innerHTML = '';
            try {
                console.log('Testing health endpoint...');
                const response = await fetch('/api/v1/health');
                const data = await response.json();
                addResult('Health Endpoint Test', response.ok, {
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                });
            } catch (error) {
                addResult('Health Endpoint Test', false, {
                    error: error.message,
                    stack: error.stack
                });
            }
        }

        async function testAuthToken() {
            resultsDiv.innerHTML = '';
            try {
                console.log('Testing auth token endpoint...');
                const response = await fetch('/api/v1/auth/test-token');
                const data = await response.json();
                addResult('Auth Token Endpoint Test', response.ok, {
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                });
            } catch (error) {
                addResult('Auth Token Endpoint Test', false, {
                    error: error.message,
                    stack: error.stack
                });
            }
        }

        async function testBoth() {
            resultsDiv.innerHTML = '';
            await testHealth();
            await testAuthToken();
        }
    </script>
</body>
</html>
