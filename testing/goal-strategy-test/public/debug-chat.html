<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Chat API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
        }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Chat API Debug Tool</h1>
    
    <div class="section">
        <h2>1. Get JWT Token</h2>
        <button onclick="getJwtToken()">Get JWT Token</button>
        <div id="jwt-result" class="log"></div>
    </div>

    <div class="section">
        <h2>2. Test Component Question Endpoint</h2>
        <label>Goal Title: <input id="goalTitle" value="become a Senior Developer"></label>
        <label>Component: 
            <select id="componentKey">
                <option value="specific">Specific</option>
                <option value="measurable">Measurable</option>
                <option value="achievable">Achievable</option>
                <option value="relevant">Relevant</option>
                <option value="timeBound">Time-bound</option>
            </select>
        </label>
        <label>Confidence: <input id="confidence" type="number" min="0" max="1" step="0.1" value="0.7"></label>
        <label>API Key (optional): <input id="apiKey" placeholder="sk-..."></label>
        <button onclick="testComponentQuestion()">Test Component Question</button>
        <div id="component-result" class="log"></div>
    </div>

    <div class="section">
        <h2>3. Test Contextual Help</h2>
        <label>User Message: <input id="userMessage" value="I don't know what metrics to use"></label>
        <button onclick="testContextualHelp()">Test Contextual Help</button>
        <div id="contextual-result" class="log"></div>
    </div>

    <div class="section">
        <h2>4. Full Chat Flow Simulation</h2>
        <button onclick="simulateFullFlow()">Simulate Full Chat Flow</button>
        <div id="flow-result" class="log"></div>
    </div>

    <script>
        let jwtToken = null;
        const baseUrl = '/api/v1';

        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toISOString();
            const className = isError ? 'error' : '';
            element.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            element.scrollTop = element.scrollHeight;
        }

        async function getJwtToken() {
            try {
                log('jwt-result', 'Fetching JWT token...');
                const response = await fetch(`${baseUrl}/auth/test-token`);
                const data = await response.json();
                
                if (data.success) {
                    jwtToken = data.data.token;
                    log('jwt-result', `Success! Token: ${jwtToken.substring(0, 50)}...`, false);
                    log('jwt-result', `User: ${JSON.stringify(data.data.user)}`, false);
                } else {
                    log('jwt-result', `Failed: ${JSON.stringify(data)}`, true);
                }
            } catch (error) {
                log('jwt-result', `Error: ${error.message}`, true);
            }
        }

        async function testComponentQuestion() {
            if (!jwtToken) {
                log('component-result', 'Please get JWT token first!', true);
                return;
            }

            const goalTitle = document.getElementById('goalTitle').value;
            const componentKey = document.getElementById('componentKey').value;
            const confidence = parseFloat(document.getElementById('confidence').value);
            const apiKey = document.getElementById('apiKey').value;

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${jwtToken}`
            };

            if (apiKey) {
                headers['X-OpenAI-API-Key'] = apiKey;
            }

            const requestBody = {
                goalTitle,
                componentKey,
                currentValue: `Working on ${componentKey} for ${goalTitle}`,
                confidence,
                isHighConfidence: confidence >= 0.7,
                goalContext: { title: goalTitle }
            };

            try {
                log('component-result', `Request: POST ${baseUrl}/goals/component-question`);
                log('component-result', `Headers: ${JSON.stringify(headers, null, 2)}`);
                log('component-result', `Body: ${JSON.stringify(requestBody, null, 2)}`);

                const response = await fetch(`${baseUrl}/goals/component-question`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('component-result', `Success! Status: ${response.status}`, false);
                    log('component-result', `Question: "${data.data.question}"`, false);
                    log('component-result', `Full response: ${JSON.stringify(data, null, 2)}`, false);
                } else {
                    log('component-result', `Failed! Status: ${response.status}`, true);
                    log('component-result', `Error: ${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                log('component-result', `Network Error: ${error.message}`, true);
                log('component-result', `Stack: ${error.stack}`, true);
            }
        }

        async function testContextualHelp() {
            if (!jwtToken) {
                log('contextual-result', 'Please get JWT token first!', true);
                return;
            }

            const userMessage = document.getElementById('userMessage').value;
            const apiKey = document.getElementById('apiKey').value;

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${jwtToken}`
            };

            if (apiKey) {
                headers['X-OpenAI-API-Key'] = apiKey;
            }

            const requestBody = {
                goalTitle: "become a Senior Developer",
                componentKey: "measurable",
                conversationHistory: [
                    {
                        role: "assistant",
                        content: "Let's make your goal measurable. What metrics will you use?"
                    },
                    {
                        role: "user",
                        content: userMessage
                    }
                ],
                goalContext: {
                    title: "become a Senior Developer",
                    confidence: 0.7
                }
            };

            try {
                log('contextual-result', `Request: POST ${baseUrl}/goals/contextual-help`);
                log('contextual-result', `Body: ${JSON.stringify(requestBody, null, 2)}`);

                const response = await fetch(`${baseUrl}/goals/contextual-help`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('contextual-result', `Success! Status: ${response.status}`, false);
                    log('contextual-result', `Help: "${data.data.helpMessage}"`, false);
                } else {
                    log('contextual-result', `Failed! Status: ${response.status}`, true);
                    log('contextual-result', `Error: ${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                log('contextual-result', `Network Error: ${error.message}`, true);
            }
        }

        async function simulateFullFlow() {
            log('flow-result', '=== Starting Full Chat Flow Simulation ===');
            
            // Step 1: Get JWT
            await getJwtToken();
            if (!jwtToken) {
                log('flow-result', 'Failed to get JWT token', true);
                return;
            }

            // Step 2: Test each component
            const components = ['specific', 'measurable', 'achievable', 'relevant', 'timeBound'];
            
            for (const component of components) {
                log('flow-result', `\n--- Testing ${component} component ---`);
                
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${jwtToken}`
                };

                const requestBody = {
                    goalTitle: "become a Senior Developer",
                    componentKey: component,
                    currentValue: `Working on ${component}`,
                    confidence: 0.6,
                    isHighConfidence: false,
                    goalContext: { title: "become a Senior Developer" }
                };

                try {
                    const response = await fetch(`${baseUrl}/goals/component-question`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();
                    
                    if (response.ok) {
                        log('flow-result', `✓ ${component}: "${data.data.question}"`, false);
                    } else {
                        log('flow-result', `✗ ${component}: ${JSON.stringify(data.error)}`, true);
                    }
                } catch (error) {
                    log('flow-result', `✗ ${component}: ${error.message}`, true);
                }

                // Small delay between requests
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            log('flow-result', '\n=== Simulation Complete ===');
        }

        // Auto-get JWT token on load
        window.onload = () => {
            getJwtToken();
        };
    </script>
</body>
</html>
