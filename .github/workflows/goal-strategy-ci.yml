name: Goal Strategy Service CI/CD

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'services/goal-strategy/**'
      - '.github/workflows/goal-strategy-ci.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'services/goal-strategy/**'

env:
  SERVICE_PATH: services/goal-strategy
  NODE_VERSION: '18.x'

jobs:
  # Phase 1: Code Quality & Security
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm ci
      
      - name: Run linting
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm run lint
      
      - name: TypeScript type checking
        working-directory: ${{ env.SERVICE_PATH }}
        run: npx tsc --noEmit
      
      - name: Security audit
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm audit --audit-level=high
      
      - name: Check for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Phase 2: Unit Tests (No API Keys Required)
  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm ci
      
      - name: Run unit tests
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          OPENAI_API_KEY: 'sk-test-mock-key-for-unit-tests'
        run: npm run test:unit -- --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ${{ env.SERVICE_PATH }}/coverage
          flags: unit-tests
          name: unit-coverage-${{ matrix.node-version }}

  # Phase 3: Integration Tests (Requires Real API Keys)
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    environment: staging
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm ci
      
      - name: Run Prisma migrations
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: npx prisma migrate deploy
      
      - name: Run integration tests
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_STAGING }}
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          TEST_TYPE: integration
        run: npm run test:integration
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: ${{ env.SERVICE_PATH }}/test-results/

  # Phase 4: Build & Package
  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm ci
      
      - name: Build service
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm run build
      
      - name: Build Docker image
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          docker build -t goal-strategy:${{ github.sha }} .
          docker tag goal-strategy:${{ github.sha }} goal-strategy:latest
      
      - name: Save Docker image
        run: |
          docker save goal-strategy:${{ github.sha }} | gzip > goal-strategy.tar.gz
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: goal-strategy.tar.gz
          retention-days: 7

  # Phase 5: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
      
      - name: Deploy to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          echo "Deploying to staging environment"
          # Add actual deployment commands here

  # Phase 6: Canary Deployment (Production)
  canary-deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: canary
    outputs:
      deployment-id: ${{ steps.deploy.outputs.deployment-id }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
      
      - name: Deploy canary (10% traffic)
        id: deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          echo "Deploying canary to 10% of production traffic"
          DEPLOYMENT_ID=$(date +%s)
          echo "deployment-id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          # Add actual canary deployment commands here

  # Phase 7: Canary Monitoring & Validation
  canary-validate:
    runs-on: ubuntu-latest
    needs: canary-deploy
    environment: canary
    steps:
      - name: Monitor canary metrics
        env:
          DEPLOYMENT_ID: ${{ needs.canary-deploy.outputs.deployment-id }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          echo "Monitoring canary deployment $DEPLOYMENT_ID"
          # Monitor for 30 minutes
          sleep 1800
          
      - name: Run smoke tests
        env:
          CANARY_URL: ${{ secrets.CANARY_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_PROD }}
        run: |
          # Run smoke tests against canary
          curl -f $CANARY_URL/health || exit 1
          
      - name: Check error rates
        run: |
          # Check logs and metrics
          echo "Checking error rates and performance metrics"
          # Add actual metric checks here

  # Phase 8: Full Production Deployment
  deploy-production:
    runs-on: ubuntu-latest
    needs: canary-validate
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
      
      - name: Deploy to production (100% traffic)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          echo "Deploying to full production"
          # Add actual production deployment commands here
      
      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Goal Strategy Service deployed to production successfully!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Rollback job (manual trigger)
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back to previous version"
          # Add rollback commands here