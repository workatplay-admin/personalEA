# PersonalEA Grafana Configuration
# Production-ready settings

[server]
# Protocol (http, https, socket)
protocol = http
http_port = 3000
domain = localhost
enforce_domain = false
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[database]
# Use SQLite for simplicity in production
type = sqlite3
path = grafana.db

[session]
# Either "memory", "file", "redis", "mysql", "postgres", default is "file"
provider = file
provider_config = sessions
cookie_name = grafana_sess
cookie_secure = false
session_life_time = 86400
gc_interval_time = 86400

[dataproxy]
# Timeout for data proxy requests
timeout = 30
keep_alive_seconds = 30
tls_handshake_timeout_seconds = 10
expect_continue_timeout_seconds = 1
max_idle_connections = 100
idle_conn_timeout_seconds = 90

[analytics]
# Disable analytics for privacy
reporting_enabled = false
check_for_updates = false

[security]
# Basic security settings
admin_user = admin
admin_password = admin # Override with environment variable
secret_key = SW2YcwTIb9zpOOhoPsMm
disable_gravatar = true
cookie_samesite = lax
cookie_secure = false
strict_transport_security = false
strict_transport_security_max_age_seconds = 86400
strict_transport_security_preload = false
strict_transport_security_subdomains = false
x_content_type_options = true
x_xss_protection = true
content_security_policy = false

[users]
# Disable user signup / registration
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
verify_email_enabled = false
login_hint = username
default_theme = dark

[auth]
# Disable anonymous access
disable_login_form = false
disable_signout_menu = false
signout_redirect_url =
oauth_auto_login = false

[auth.anonymous]
# Disable anonymous access
enabled = false

[auth.basic]
enabled = true

[smtp]
enabled = false

[emails]
welcome_email_on_sign_up = false

[log]
# Logging configuration
mode = console
level = info
filters =

[log.console]
level =
format = console

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[alerting]
# Alerting configuration
enabled = true
execute_alerts = true
evaluation_timeout = 30s
notification_timeout = 30s
max_attempts = 3
min_interval = 1m

[annotations.dashboard]
# Dashboard annotations
max_age =
max_annotations_to_keep =

[dashboards]
# Dashboard settings
versions_to_keep = 20
min_refresh_interval = 5s
default_home_dashboard_path =

[smtp]
enabled = false

[quota]
# Quota settings
enabled = false

[unified_alerting]
enabled = true
execute_alerts = true
evaluation_timeout = 30s
notification_timeout = 30s
max_attempts = 3
min_interval = 10s

[unified_alerting.screenshots]
# Enable screenshots for alerts
capture = true
max_concurrent_screenshots = 5
upload_external_image_storage = false

[metrics]
enabled = true
interval_seconds = 10
disable_total_stats = false

[metrics.graphite]
address =
prefix = prod.grafana.%(instance_name)s.

[snapshots]
external_enabled = false

[external_image_storage]
provider =

[rendering]
# Server-side rendering
server_url =
callback_url =
concurrent_render_request_limit = 30

[panels]
# Disable panel plugins that phone home
disable_sanitize_html = false

[plugins]
enable_alpha = false
app_tls_skip_verify_insecure = false

[feature_toggles]
enable =