# Alertmanager Configuration
# Routes alerts to appropriate receivers

global:
  # The smarthost and SMTP sender used for mail notifications.
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@personalea.com'
  smtp_require_tls: false
  
  # Default values for alert annotations
  resolve_timeout: 5m
  
  # Slack webhook URL (if using Slack)
  # slack_api_url: 'YOUR_SLACK_WEBHOOK_URL'

# The directory from which notification templates are read.
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# The root route on which each incoming alert enters.
route:
  # The labels by which incoming alerts are grouped together.
  group_by: ['alertname', 'cluster', 'service']
  
  # When a new group of alerts is created by an incoming alert, wait at
  # least 'group_wait' to send the initial notification.
  group_wait: 10s
  
  # When the first notification was sent, wait 'group_interval' to send a batch
  # of new alerts that started firing for that group.
  group_interval: 30s
  
  # If an alert has successfully been sent, wait 'repeat_interval' to
  # resend them.
  repeat_interval: 12h
  
  # Default receiver
  receiver: 'default'
  
  # Child routes
  routes:
    # Critical alerts
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      continue: true
    
    # Database alerts
    - match_re:
        service: ^(postgresql|redis)$
      receiver: 'database-alerts'
      group_by: ['alertname', 'service', 'instance']
      continue: true
    
    # API service alerts
    - match_re:
        service: ^(goal-strategy|email-processing)$
      receiver: 'api-alerts'
      group_by: ['alertname', 'service']
      continue: true
    
    # Security alerts
    - match:
        team: security
      receiver: 'security-alerts'
      group_wait: 0s
      group_interval: 5s
      repeat_interval: 12h
    
    # Performance warnings
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

# Inhibition rules allow to mute a set of alerts given that another alert is firing.
inhibit_rules:
  # Mute any warning-level notifications if the same alert is already critical.
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  
  # Mute service-specific alerts if the entire service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['service']

# Receivers
receivers:
  # Default receiver
  - name: 'default'
    email_configs:
      - to: 'devops@personalea.com'
        headers:
          Subject: 'PersonalEA Alert: {{ .GroupLabels.alertname }}'

  # Critical alerts receiver
  - name: 'critical-alerts'
    email_configs:
      - to: 'critical-alerts@personalea.com'
        headers:
          Subject: 'CRITICAL: {{ .GroupLabels.alertname }} on {{ .GroupLabels.service }}'
    # Uncomment to enable Slack notifications
    # slack_configs:
    #   - channel: '#critical-alerts'
    #     title: 'Critical Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
    #     send_resolved: true
    # Uncomment to enable PagerDuty
    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
    #     description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'

  # Database alerts receiver
  - name: 'database-alerts'
    email_configs:
      - to: 'database-team@personalea.com'
        headers:
          Subject: 'Database Alert: {{ .GroupLabels.alertname }} on {{ .GroupLabels.service }}'
    # webhook_configs:
    #   - url: 'http://database-oncall-webhook.personalea.com/webhook'

  # API alerts receiver
  - name: 'api-alerts'
    email_configs:
      - to: 'api-team@personalea.com'
        headers:
          Subject: 'API Alert: {{ .GroupLabels.alertname }} on {{ .GroupLabels.service }}'
    # slack_configs:
    #   - channel: '#api-alerts'
    #     title: 'API Service Alert'
    #     text: '{{ .CommonAnnotations.summary }}'

  # Security alerts receiver
  - name: 'security-alerts'
    email_configs:
      - to: 'security@personalea.com'
        headers:
          Subject: 'SECURITY ALERT: {{ .GroupLabels.alertname }}'
          X-Priority: '1'
    # webhook_configs:
    #   - url: 'http://security-siem.personalea.com/webhook'
    #     send_resolved: false

  # Warning alerts receiver
  - name: 'warning-alerts'
    email_configs:
      - to: 'warnings@personalea.com'
        headers:
          Subject: 'Warning: {{ .GroupLabels.alertname }}'
    # Only send to Slack, no email for warnings
    # slack_configs:
    #   - channel: '#warnings'
    #     title: 'Warning'
    #     text: '{{ .CommonAnnotations.summary }}'
    #     send_resolved: true
