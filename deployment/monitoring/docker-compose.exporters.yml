# PersonalEA Monitoring Exporters
# Additional exporters for comprehensive metrics collection

version: '3.8'

services:
  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: personalea-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*)$$'
      - '--collector.netdev.device-exclude=^(veth.*)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    restart: always
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # cAdvisor for Docker container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: personalea-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /cgroup:/cgroup:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: personalea-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://personalea:${POSTGRES_PASSWORD}@postgres:5432/personalea?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_INCLUDE_DATABASE_QUERIES: "true"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      - postgres
    restart: always
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: personalea-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_EXPORTER_CHECK_KEYS: "*"
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: "queue:*,cache:*,session:*"
      REDIS_EXPORTER_INCL_SYSTEM_METRICS: "true"
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis
    restart: always
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: personalea-nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    ports:
      - "127.0.0.1:9113:9113"
    depends_on:
      - nginx
    restart: always
    networks:
      - frontend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # Blackbox Exporter for endpoint monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: personalea-blackbox-exporter
    volumes:
      - ./blackbox-exporter.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    restart: always
    networks:
      - frontend
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Process Exporter for detailed process metrics
  process-exporter:
    image: ncabatoff/process-exporter:latest
    container_name: personalea-process-exporter
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter.yml:/config/process-exporter.yml:ro
    command:
      - '--procfs=/host/proc'
      - '--config.path=/config/process-exporter.yml'
    ports:
      - "127.0.0.1:9256:9256"
    restart: always
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Alertmanager for alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: personalea-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    ports:
      - "127.0.0.1:9093:9093"
    restart: always
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Pushgateway for batch job metrics
  pushgateway:
    image: prom/pushgateway:latest
    container_name: personalea-pushgateway
    ports:
      - "127.0.0.1:9091:9091"
    restart: always
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  alertmanager_data:
    driver: local

networks:
  frontend:
    external: true
    name: personalea_frontend
  backend:
    external: true
    name: personalea_backend
  monitoring:
    external: true
    name: personalea_monitoring
