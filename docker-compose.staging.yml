# PersonalEA Staging Environment for User Testing
# This configuration deploys available services for user testing
# 
# ⚠️  CRITICAL LIMITATIONS:
# - Calendar Service is completely missing (blocks full workflow)
# - Data Sovereignty Framework not implemented (privacy concerns)
# - Only Goal Strategy and Email services available for testing

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: personalea_staging
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: staging_password
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./services/goal-strategy/prisma/migrations:/docker-entrypoint-initdb.d/goal-migrations:ro
      - ./services/email-processing/prisma/migrations:/docker-entrypoint-initdb.d/email-migrations:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d personalea_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - staging_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Goal Strategy Service (Phases 1-3 Complete)
  goal-strategy-service:
    build:
      context: ./services/goal-strategy
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=staging
      - DATABASE_URL=postgresql://staging_user:staging_password@postgres:5432/personalea_staging
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=staging-jwt-secret-change-in-production
      - LOG_LEVEL=debug
      # ⚠️ PRIVACY WARNING: Using shared OpenAI key - violates data sovereignty
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Email Processing Service (Production Ready)
  email-processing-service:
    build:
      context: ./services/email-processing
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=staging
      - DATABASE_URL=postgresql://staging_user:staging_password@postgres:5432/personalea_staging
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=staging-jwt-secret-change-in-production
      - LOG_LEVEL=debug
      # ⚠️ PRIVACY WARNING: Using shared OpenAI key - violates data sovereignty
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMAIL_ENCRYPTION_KEY=staging-32-char-encryption-key-001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Goal Strategy Testing UI (React + Vite)
  goal-testing-ui:
    build:
      context: ./testing/goal-strategy-test
      dockerfile: Dockerfile.staging
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api/v1
      - VITE_STAGING_MODE=true
      - VITE_PRIVACY_WARNING=true
    ports:
      - "5173:5173"
    depends_on:
      - goal-strategy-service
    restart: unless-stopped

  # Service Health Monitor
  health-monitor:
    image: nginx:alpine
    volumes:
      - ./staging/health-check.html:/usr/share/nginx/html/index.html:ro
      - ./staging/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - goal-strategy-service
      - email-processing-service
    restart: unless-stopped

volumes:
  staging_postgres_data:
    driver: local
  staging_redis_data:
    driver: local

networks:
  default:
    name: personalea-staging